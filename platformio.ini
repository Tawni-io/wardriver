; Wardriver (Rufous) — LILYGO T-Display C5 + ATGM336H GPS
; See README.md and TAWNI.md.

[platformio]
default_envs = tawni
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Lilygo-T-Display-C5
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
  lvgl/lvgl@9.2.0
  h2zero/NimBLE-Arduino@^2.3.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -Isrc
  -DUSE_TOUCH_SWIPE=1
monitor_filters = esp32_exception_decoder
; Strip C:/Users/<host>/... from __FILE__ in every env. Public images are
; release-only (GitHub, SoftAP, USB that leaves the bench) — no -ggdb2.
extra_scripts = pre:tools/pio_strip_host_paths.py

[env:tawni]
; Hard rule: public firmware is build_type=release (script refuses debug here).
build_type = release
build_flags =
  ${env.build_flags}
  -DTAWNI_VERSION=\"0.3.4\"
