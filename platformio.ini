; Tawni face — LILYGO T-Display C5
; Cabin firmware for this face is TBD. See README.md and TAWNI.md.

[platformio]
default_envs = tawni
boards_dir = boards

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = Lilygo-T-Display-C5
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
lib_deps =
  lvgl/lvgl@9.2.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -Isrc
  -DUSE_TOUCH_SWIPE=1
monitor_filters = esp32_exception_decoder

[env:tawni]
build_flags =
  ${env.build_flags}
  -DTAWNI_VERSION=\"0.0.0\"
